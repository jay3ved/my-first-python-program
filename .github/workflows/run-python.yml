name: Run python Script
on:
   workflow_dispatch:

jobs:
   run-code:
     runs-on: ubuntu-latest
     steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.8'

        - name: Execute Python File
          run: python my_program.py
